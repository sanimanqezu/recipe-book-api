services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recipebook-app
    environment:
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: recipebook
      DB_USERNAME: postgres
    ports:
    - 8080:8080
    restart: unless-stopped
    networks:
    - portfolio-net
networks:
  portfolio-net:
    external: true
